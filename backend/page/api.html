<!DOCTYPE html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="api.css" />
    <script src="api.js"></script>
    <title>API Page</title>
  </head>
  <body>
    <header>
      <h1>API interact Page</h1>
    </header>
    <main>
      <div class="api-post">
        <div class="forms">
          <div class="form-contacto">
            <form id="form-contacto">
              <label for="nome">Nome</label>
              <input
                id="nome"
                name="nome"
                type="text"
                placeholder="Coloque o seu nome aqui"
              />
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="Introduza o seu email aqui"
              />
              <label for="assunto">Assunto</label>

              <input
                id="assunto"
                name="assunto"
                type="text"
                placeholder="Assunto"
              />
              <label for="mensagem">Mensagem</label>
              <textarea
                id="mensagem"
                name="mensagem"
                placeholder="A sua mensagem aqui"
              ></textarea>
              <button type="submit">Enviar</button>
            </form>
          </div>
        </div>
      </div>
      <div class="api-gets">
        <div class="contacto-list"></div>
      </div>
    </main>
    <footer>
      <p>
        &copy; <strong><i>Guilherme Eusébio e Santiago Costa</i></strong>
      </p>
    </footer>
  </body>
</html>
