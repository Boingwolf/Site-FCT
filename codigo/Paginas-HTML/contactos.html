<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">

        <a href="contactos.html">Contactos</a>

    <main>
        <div id="contactos">
            <div id="contat">
                <h2>Contactos</h2>
                <p>Telefone: +351 929 415 665</p>
                <p>Email: contacto@aromawake.com</p>
            </div>
            <div id="form">
                <h2>Formulário de Contacto</h2>
                <form action="#">
                    <p>Nome: <input type="text" name="nome" id="nome"></p>
                    <p>Email: <input type="email" name="email" id="email"></p>
                    <p>Assunto: <input type="text" name="assunto" id="assunto"></p>
                    <p>Mensagem: <br><textarea name="mensagem" id="mensagem" cols="30" rows="7"></textarea></p>
                    <p><input type="submit" value="Enviar" onclick="enviarFormulario()" id="btnEnviar"></p>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; <strong><i>Guilherme Eusébio e Santiago Costa</i></strong></p>
